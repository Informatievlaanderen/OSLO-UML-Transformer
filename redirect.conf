# ── KVS (conceptscheme/concept) redirects ─────────────────────────────
# Exception redirects for specific conceptscheme and concept URLs with
# content negotiation support.
#
# These were previously in id.proxy and are moved here as a test of the
# dynamic redirects mechanism.
# ───────────────────────────────────────────────────────────────────────

location ~ /id/conceptscheme/(Deeltrajecttype|FinaliteitType|OrganisatieType|Participatietype|PubliekeDienstverleningType|Trajectstatustype|Voorkeurtype)/?$ {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';

    set $name $1;
    set $extension "";

    if ( $rdffileextension != "" ) {
        set $extension $rdffileextension;
    }

    if ($extension = "jsonld") {
        return 302 https://raw.githubusercontent.com/Informatievlaanderen/OSLOthema-KVS/refs/heads/main/resources/codelijsten/$name.jsonld;
    }

    if ($extension = "ttl") {
        return 302 https://raw.githubusercontent.com/Informatievlaanderen/OSLOthema-KVS/refs/heads/main/codelijsten/$name.ttl;
    }

    return 303 $redirect_scheme://$host/doc/conceptscheme/$name;
}

location ~ /id/concept/(Deeltrajecttype|FinaliteitType|OrganisatieType|Participatietype|PubliekeDienstverleningType|Trajectstatustype|Voorkeurtype)/([^/]+)/?$ {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';

    set $name $1;
    set $concept_name $2;
    set $extension "";

    if ( $rdffileextension != "" ) {
        set $extension $rdffileextension;
    }

    if ($extension = "jsonld") {
        return 302 https://raw.githubusercontent.com/Informatievlaanderen/OSLOthema-KVS/refs/heads/main/resources/codelijsten/$name/$concept_name.jsonld;
    }

    return 303 $redirect_scheme://$host/doc/concept/$name/$concept_name;
}

# ── Generic /id catch-all redirect ────────────────────────────────────
# Herleid de effectieve identifiers naar hun /doc variant.
# Gebruik 303 See Other zoals vereist door de Cool URIs-aanpak (httpRange-14)
# zodat /id/-URI's (non-information resources) doorverwijzen naar /doc/-URI's
# (information resources).
#
# This was previously in id.proxy and is moved here as a test of the
# dynamic redirects mechanism.
# ───────────────────────────────────────────────────────────────────────

location ~ /id(/?.*) {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';

    set $match $1;
    return 303 $redirect_scheme://$host/doc$match$is_args$args;
}

# ── Steps redirects ───────────────────────────────────────────────────
# Redirect /steps and /STEPS to the OSLO steps page on purl.eu.
#
# These were previously in steps.proxy and are moved here as a test of
# the dynamic redirects mechanism.
# ───────────────────────────────────────────────────────────────────────

location /steps {
    return 302 https://purl.eu/cms/oslo-service/oslo-steps/intro.html;
}

location /STEPS {
    return 302 https://purl.eu/cms/oslo-service/oslo-steps/intro.html;
}
