#
# Redirects configuration for data.vlaanderen.be
#
# This file is periodically monitored by nginxReloader.sh.
# When changes are detected, NGINX automatically reloads with zero downtime.
#
# How to add a redirect:
#   1. Add a new location block below
#   2. Commit and push the change to GitHub
#   3. The reloader fetches the file from GitHub every 5 minutes and
#      reloads NGINX automatically when a change is detected.
#
# ── NGINX location matching priority ──────────────────────────────────
#   Priority  Type              Example
#   1 (highest) location = /exact        Exact match
#   2          location ^~ /prefix       Prefix match, stops regex search
#   3          location ~ regex          Regex match, first match wins,
#                                        in order of appearance
#   4 (lowest)  location /prefix         Regular prefix match,
#                                        longest match wins
#
#   Note: Regex locations (~) in this file are evaluated AFTER those in
#   location-enabled/*.proxy files. Use ^~ or = if you need a redirect
#   in this file to take priority over any regex in a .proxy file.
# ───────────────────────────────────────────────────────────────────────
#
# Examples:
#
# Simple redirect (exact path match):
#   location = /oud-pad {
#       return 301 https://data.vlaanderen.be/nieuw-pad;
#   }
#
# Prefix redirect (all paths under /oud/):
#   location ^~ /oud/ {
#       return 301 https://data.vlaanderen.be/nieuw/;
#   }
#
# Regex redirect (with capture groups):
#   location ~ ^/oud-domein/(.*)$ {
#       return 301 https://nieuw-domein.be/$1;
#   }
#
# Proxy pass instead of redirect:
#   location /api/ {
#       proxy_pass http://backend-service;
#   }
#

# ── OSLO redirect ─────────────────────────────────────────────────────
# Redirect root and /cms paths to the new OSLO page.
# Exceptions: specific PDFs, treeview.js, and /cms/ap/openbaar-domein/
# and /cms/openbaardomein files still proxy through to the generated
# repository.
#
# These were previously in oslo-redirect.proxy and are moved here as a
# test of the dynamic redirects mechanism.
# ───────────────────────────────────────────────────────────────────────

# Exact match — allows specific PDFs through
location = /cms/Proces_en_methode_voor_de_erkenning_van_datastandaarden_v1.0.pdf {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';
    proxy_pass $ENV_GENERATED_REPOSITORY;
}

# Exact match — allows the VlaamseURI-StandaardVoorData PDF through
location = /cms/VlaamseURI-StandaardVoorData_V1.0.pdf {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';
    proxy_pass $ENV_GENERATED_REPOSITORY;
}

# Exact match — allows treeview.js through for taxonomies
location = /cms/scripts/treeview.js {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';
    proxy_pass $ENV_GENERATED_REPOSITORY;
}

# Prefix match — allows all /cms/ap/openbaar-domein/ files through (e.g. overview.jpg)
location ^~ /cms/ap/openbaar-domein/ {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';
    proxy_pass $ENV_GENERATED_REPOSITORY;
}

# Prefix match — allows all /cms/openbaardomein files through (e.g. index.html)
location ^~ /cms/openbaardomein {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';
    proxy_pass $ENV_GENERATED_REPOSITORY;
}

# ^~ prefix match — beats all regex locations (like cms.proxy's regex),
# so /cms/over, /cms/disclaimer, etc. all redirect instead of proxying
location ^~ /cms {
    add_header 'Access-Control-Allow-Origin' '*';
    return 301 https://www.vlaanderen.be/digitaal-vlaanderen/onze-diensten-en-platformen/oslo;
}

# Exact match — beats the prefix "location /" in the root handler
location = / {
    add_header 'Access-Control-Allow-Origin' '*';
    return 301 https://www.vlaanderen.be/digitaal-vlaanderen/onze-diensten-en-platformen/oslo;
}

